<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>Ustawienia – Transkrypcja głosówek</title>
<style>
  body { max-width: 640px; margin: 24px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], input[type=password], textarea, select { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  textarea { height: 90px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .muted { opacity: .7; font-weight: 400; }
  #saved { color: #2e7d32; margin-left: 10px; }
</style>
<h1>Ustawienia</h1>

<label for="mode">Tryb transkrypcji</label>
<select id="mode">
  <option value="local">Lokalny (Whisper w przeglądarce, za darmo)</option>
  <option value="groq">Groq API (awaryjny, whisper-large-v3)</option>
</select>

<label for="encoderDtype">Precyzja enkodera (WebGPU) <span class="muted">– fp16 dokładniejszy (1,3 GB), q4 lżejszy (0,4 GB)</span></label>
<select id="encoderDtype">
  <option value="fp16">fp16</option>
  <option value="q4f16">q4f16</option>
  <option value="q4">q4</option>
</select>

<label for="groqKey">Klucz Groq <span class="muted">(console.groq.com; zapisany tylko w tej przeglądarce)</span></label>
<input id="groqKey" type="password" autocomplete="off">

<label for="anthropicKey">Klucz Anthropic <span class="muted">(tylko dla korekty / TL;DR)</span></label>
<input id="anthropicKey" type="password" autocomplete="off">

<label for="vocab">Słowniczek terminów <span class="muted">(oddzielone przecinkami)</span></label>
<textarea id="vocab"></textarea>

<div class="row"><input id="correct" type="checkbox"><label for="correct" style="margin:0">Korekta pisowni terminów (Claude Haiku)</label></div>
<div class="row"><input id="tldr" type="checkbox"><label for="tldr" style="margin:0">Dodaj TL;DR (Claude Haiku)</label></div>

<div class="row"><button id="save">Zapisz</button><button id="reset">Przywróć domyślne</button><span id="saved"></span></div>
<script type="module" src="options.js"></script>
